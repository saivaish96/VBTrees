sonar.projectName=VB Trees React Native

sonar.sources=app,components,hooks,constants
sonar.tests=__tests__

sonar.test.inclusions=__tests__/**/*.test.js,__tests__/**/*.test.jsx,__tests__/**/*.test.ts,__tests__/**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.expo/**,assets/data/**,infra/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8